_target_: picid.model.estimators.xgboost.wrapper.FitPredictXGBoostWrapper
task_type: ${task_definition.task_type}

seq_len: ${task_definition.seq_len}      # window size
label_len: ${task_definition.label_len}  # overlap size
pred_len: ${task_definition.pred_len}    # prediction size

# Additional params needed for wrapper to run:
features_mode: no_feature_mode

# The source paper reports context/stride tuning but does not enumerate the
# tree-specific search grid. Keep the released wrapper's 1,000-stage and seed
# defaults; make CPU execution and the pinned XGBoost version explicit.
n_estimators: 1000
random_state: 42
n_jobs: 8
device: cpu
